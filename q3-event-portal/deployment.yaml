apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-portal
  labels:
    app: event-portal
spec:
  replicas: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: event-portal
  template:
    metadata:
      labels:
        app: event-portal
    spec:
      containers:
        - name: event-portal
          image: suhaib08/event-portal:v1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: event-portal-service
spec:
  type: NodePort
  selector:
    app: event-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30083
